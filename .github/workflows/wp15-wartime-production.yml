name: WP-15 Wartime Controlled Production

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact bounded production operation
        required: true
        type: choice
        options:
          - greenfield-canary-fast
          - greenfield-package
          - greenfield-preflight
          - greenfield-backup-restore
          - greenfield-deploy
          - greenfield-inspect
          - greenfield-rollback
          - preflight
          - backup-restore
          - archive-backup
          - deploy
          - inspect
          - rollback
          - maintenance
          - live
      candidate:
        description: Exact frozen candidate SHA
        required: true
        type: string
      backup_run_id:
        description: Exact database restore proof run required by archive/deploy
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Exact unexpired Greenfield preflight run required by backup/deploy
        required: false
        default: ""
        type: string
      deploy_run_id:
        description: Exact Greenfield deploy run required by inspect/rollback
        required: false
        default: ""
        type: string
      archive_run_id:
        description: Successful off-host archive workflow run required by deploy
        required: false
        default: ""
        type: string
      confirmation:
        description: Exact reviewed confirmation phrase
        required: true
        type: string
      pro_review_evidence_sha256:
        description: Exact independently supplied Pro entrypoint review evidence SHA-256
        required: false
        default: ""
        type: string
      pro_review_evidence_b64:
        description: Non-sensitive base64 independent Pro review evidence JSON
        required: false
        default: ""
        type: string
      execution_authorization_sha256:
        description: Exact protected Owner execution authorization evidence SHA-256
        required: false
        default: ""
        type: string
      recipient_public_key_b64:
        description: Base64 RSA-4096 public key used to encrypt the bootstrap response
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: wp15-wartime-controlled-production
  cancel-in-progress: false

jobs:
  greenfield_package:
    if: >-
      inputs.phase == 'greenfield-package' &&
      inputs.confirmation == 'PACKAGE_GREENFIELD_CANARY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out reviewed Greenfield operations entrypoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check out exact frozen application candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate }}
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: candidate/apps/web/package-lock.json
      - name: Verify exact clean application candidate
        run: |
          set -euo pipefail
          candidate='${{ inputs.candidate }}'
          printf '%s\n' "$candidate" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git -C candidate rev-parse --verify HEAD)" = '${{ inputs.candidate }}'
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          test '${{ inputs.backup_run_id }}' = ''
          test '${{ inputs.archive_run_id }}' = ''
          (cd candidate && python3 scripts/wp07_candidate.py preflight)
          python3 scripts/wp31_prepare_amd64_dockerfiles.py \
            --candidate-root candidate \
            --output "$RUNNER_TEMP/wp31-amd64-build" \
            --candidate "$candidate"
      - name: Re-run candidate machine gates
        run: |
          set -euo pipefail
          restore() {
            git -C candidate restore -- \
              apps/api/Dockerfile apps/worker/Dockerfile apps/web/Dockerfile
          }
          trap restore EXIT
          cp "$RUNNER_TEMP/wp31-amd64-build/Dockerfile.api.amd64" \
            candidate/apps/api/Dockerfile
          cp "$RUNNER_TEMP/wp31-amd64-build/Dockerfile.worker.amd64" \
            candidate/apps/worker/Dockerfile
          cp "$RUNNER_TEMP/wp31-amd64-build/Dockerfile.web.amd64" \
            candidate/apps/web/Dockerfile
          make -C candidate ci-main
          restore
          trap - EXIT
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
      - name: Build amd64 images and immutable candidate package
        run: |
          set -euo pipefail
          candidate_sha='${{ inputs.candidate }}'
          docker build --pull --platform linux/amd64 \
            --build-arg VCS_REF="$candidate_sha" \
            -t "journey-next-candidate-api:$candidate_sha" \
            -f "$RUNNER_TEMP/wp31-amd64-build/Dockerfile.api.amd64" candidate
          docker build --pull --platform linux/amd64 \
            --build-arg VCS_REF="$candidate_sha" \
            -t "journey-next-candidate-worker:$candidate_sha" \
            -f "$RUNNER_TEMP/wp31-amd64-build/Dockerfile.worker.amd64" candidate
          docker build --pull --platform linux/amd64 \
            --build-arg VCS_REF="$candidate_sha" \
            -t "journey-next-candidate-web:$candidate_sha" \
            -f "$RUNNER_TEMP/wp31-amd64-build/Dockerfile.web.amd64" candidate/apps/web
          cp "$RUNNER_TEMP/wp31-amd64-build/Dockerfile.api.amd64" \
            candidate/apps/api/Dockerfile
          make -C candidate candidate-task-versions
          git -C candidate restore -- apps/api/Dockerfile
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          make -C candidate candidate-sboms
          cp "$RUNNER_TEMP/wp31-amd64-build/build-definition-manifest.json" \
            candidate/artifacts/wp07-candidate/amd64-build-definition-manifest.json
          (cd candidate && python3 scripts/wp07_candidate.py generate \
            --output artifacts/wp07-candidate/release-manifest.json \
            --task-versions artifacts/wp07-candidate/task-versions.json \
            --image "api=journey-next-candidate-api:$candidate_sha" \
            --image "web=journey-next-candidate-web:$candidate_sha" \
            --image "worker=journey-next-candidate-worker:$candidate_sha" \
            --sbom api=artifacts/wp07-candidate/api.spdx.json \
            --sbom web=artifacts/wp07-candidate/web.spdx.json \
            --sbom worker=artifacts/wp07-candidate/worker.spdx.json)
          (cd candidate && python3 scripts/wp07_candidate.py verify \
            artifacts/wp07-candidate/release-manifest.json)
      - name: Verify commit-tag registry targets are absent
        run: make -C candidate candidate-registry-check
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exact commit-tagged images and bind registry digests
        run: |
          set -euo pipefail
          candidate='${{ inputs.candidate }}'
          for service in api web worker; do
            docker tag \
              "journey-next-candidate-$service:$candidate" \
              "ghcr.io/muchenai/muchen-journey-vnext-$service:$candidate"
            docker push \
              "ghcr.io/muchenai/muchen-journey-vnext-$service:$candidate"
          done
          (cd candidate && python3 scripts/wp07_candidate.py registry \
            --manifest artifacts/wp07-candidate/release-manifest.json \
            --registry-image "api=ghcr.io/muchenai/muchen-journey-vnext-api:$candidate" \
            --registry-image "web=ghcr.io/muchenai/muchen-journey-vnext-web:$candidate" \
            --registry-image "worker=ghcr.io/muchenai/muchen-journey-vnext-worker:$candidate")
          (cd candidate && python3 scripts/wp07_candidate.py verify \
            artifacts/wp07-candidate/release-manifest.json)
      - name: Generate and verify candidate binding artifact
        run: |
          set -euo pipefail
          python3 scripts/wp31_candidate_binding.py generate \
            --manifest candidate/artifacts/wp07-candidate/release-manifest.json \
            --package-run-id "$GITHUB_RUN_ID" \
            --output candidate/artifacts/wp07-candidate/candidate-binding.json
          python3 scripts/wp31_candidate_binding.py verify \
            --binding candidate/artifacts/wp07-candidate/candidate-binding.json
      - name: Generate verifiable non-self-referential evidence checksums
        run: |
          set -euo pipefail
          cd candidate/artifacts/wp07-candidate
          files=(release-manifest.json api.spdx.json web.spdx.json worker.spdx.json task-versions.json amd64-build-definition-manifest.json candidate-binding.json)
          : >SHA256SUMS
          for file in "${files[@]}"; do sha256sum "$file" >>SHA256SUMS; done
          test "$(wc -l <SHA256SUMS | tr -d ' ')" = 7
          if grep -qE '[[:space:]]SHA256SUMS$' SHA256SUMS; then exit 2; fi
          sha256sum -c SHA256SUMS
      - name: Upload exact registry-bound candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp07-candidate-${{ inputs.candidate }}
          path: |
            candidate/artifacts/wp07-candidate/release-manifest.json
            candidate/artifacts/wp07-candidate/api.spdx.json
            candidate/artifacts/wp07-candidate/web.spdx.json
            candidate/artifacts/wp07-candidate/worker.spdx.json
            candidate/artifacts/wp07-candidate/task-versions.json
            candidate/artifacts/wp07-candidate/amd64-build-definition-manifest.json
            candidate/artifacts/wp07-candidate/candidate-binding.json
            candidate/artifacts/wp07-candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Upload candidate binding handoff artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp31-candidate-binding-${{ github.run_id }}
          path: |
            candidate/artifacts/wp07-candidate/candidate-binding.json
            candidate/artifacts/wp07-candidate/release-manifest.json
            candidate/artifacts/wp07-candidate/api.spdx.json
            candidate/artifacts/wp07-candidate/web.spdx.json
            candidate/artifacts/wp07-candidate/worker.spdx.json
            candidate/artifacts/wp07-candidate/task-versions.json
            candidate/artifacts/wp07-candidate/amd64-build-definition-manifest.json
            candidate/artifacts/wp07-candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  greenfield_authorize:
    if: >-
      inputs.candidate == '0e86352d109fd49c7e4f4fc26d36a14822dc7219' &&
      ((inputs.phase == 'greenfield-canary-fast' && inputs.confirmation == 'FAST_CANARY_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-preflight' && inputs.confirmation == 'PREFLIGHT_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-backup-restore' && inputs.confirmation == 'BACKUP_RESTORE_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-deploy' && inputs.confirmation == 'DEPLOY_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-inspect' && inputs.confirmation == 'INSPECT_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-rollback' && inputs.confirmation == 'ROLLBACK_0E86352_TO_FF53052'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      reviewed_ops_commit_sha: ${{ steps.authorize.outputs.reviewed_ops_commit_sha }}
      reviewed_ops_ref: ${{ steps.authorize.outputs.reviewed_ops_ref }}
      pro_review_evidence_sha256: ${{ steps.authorize.outputs.pro_review_evidence_sha256 }}
    steps:
      - name: Check out the workflow dispatch commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Authorize exact immutable operations without environment or configured secrets
        id: authorize
        env:
          PRO_REVIEW_EVIDENCE_B64: ${{ inputs.pro_review_evidence_b64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          [[ '${{ inputs.execution_authorization_sha256 }}' =~ ^[0-9a-f]{64}$ ]]
          for name in VOLCENGINE_ACCESS_KEY VOLCENGINE_SECRET_KEY WP08_MIGRATION_DB_PASSWORD WP08_RUNTIME_DB_PASSWORD WP15_BACKUP_KEY WP31_EXECUTION_AUTHORIZATION_B64; do
            test -z "${!name:-}"
          done
          python3 scripts/wp31_greenfield_canary.py contract-check
          python3 scripts/wp31_ops_closure.py
          reviewed=""
          reviewed_ref=""
          pro_review_hash=""
          if [[ '${{ inputs.phase }}' == greenfield-canary-fast ]]; then
            # The production-canary-uat Environment approval is the single human approval.
            reviewed="$GITHUB_SHA"
            reviewed_ref="$GITHUB_REF"
            pro_review_hash=""
            test -z '${{ inputs.preflight_run_id }}'
            test -z '${{ inputs.backup_run_id }}'
            test -z '${{ inputs.deploy_run_id }}'
            test -z '${{ inputs.archive_run_id }}'
          elif [[ '${{ inputs.phase }}' == greenfield-preflight ]]; then
            test -z '${{ inputs.preflight_run_id }}'
            test -z '${{ inputs.backup_run_id }}'
            test -z '${{ inputs.deploy_run_id }}'
          elif [[ '${{ inputs.phase }}' == greenfield-backup-restore ]]; then
            [[ '${{ inputs.preflight_run_id }}' =~ ^[1-9][0-9]{5,19}$ ]]
            test -z '${{ inputs.backup_run_id }}'
            test -z '${{ inputs.deploy_run_id }}'
          elif [[ '${{ inputs.phase }}' == greenfield-deploy ]]; then
            [[ '${{ inputs.preflight_run_id }}' =~ ^[1-9][0-9]{5,19}$ ]]
            [[ '${{ inputs.backup_run_id }}' =~ ^[1-9][0-9]{5,19}$ ]]
            test -z '${{ inputs.deploy_run_id }}'
          elif [[ '${{ inputs.phase }}' == greenfield-inspect || '${{ inputs.phase }}' == greenfield-rollback ]]; then
            [[ '${{ inputs.preflight_run_id }}' =~ ^[1-9][0-9]{5,19}$ ]]
            [[ '${{ inputs.backup_run_id }}' =~ ^[1-9][0-9]{5,19}$ ]]
            [[ '${{ inputs.deploy_run_id }}' =~ ^[1-9][0-9]{5,19}$ ]]
          else
            exit 2
          fi
          test -z '${{ inputs.archive_run_id }}'
          {
            echo "reviewed_ops_commit_sha=$reviewed"
            echo "reviewed_ops_ref=$reviewed_ref"
            echo "pro_review_evidence_sha256=$pro_review_hash"
          } >>"$GITHUB_OUTPUT"
          if [[ '${{ inputs.phase }}' != greenfield-canary-fast ]]; then
            test -n "$PRO_REVIEW_EVIDENCE_B64"
            [[ '${{ inputs.pro_review_evidence_sha256 }}' =~ ^[0-9a-f]{64}$ ]]
            evidence="$RUNNER_TEMP/wp31-pro-review-evidence.json"
            umask 077
            printf '%s' "$PRO_REVIEW_EVIDENCE_B64" | base64 --decode >"$evidence"
            python3 scripts/wp31_greenfield_canary.py review-check \
              --evidence "$evidence" \
              --evidence-sha256 '${{ inputs.pro_review_evidence_sha256 }}' \
              --executing-ref "$GITHUB_REF"
            reviewed=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["reviewed_ops_commit_sha"])' "$evidence")
            reviewed_ref=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["reviewed_ops_ref"])' "$evidence")
            test "$reviewed" = "$GITHUB_SHA"
            test "$reviewed_ref" = "$GITHUB_REF"
            echo "pro_review_evidence_sha256=${{ inputs.pro_review_evidence_sha256 }}" >>"$GITHUB_OUTPUT"
            rm -f -- "$evidence"
          fi

  greenfield_execution_authorize:
    needs: greenfield_authorize
    if: >-
      needs.greenfield_authorize.result == 'success' &&
      needs.greenfield_authorize.outputs.reviewed_ops_commit_sha == github.sha &&
      needs.greenfield_authorize.outputs.reviewed_ops_ref == github.ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-canary-uat
    permissions:
      contents: read
    outputs:
      execution_authorization_sha256: ${{ steps.owner_authorize.outputs.execution_authorization_sha256 }}
    env:
      WP31_EXECUTION_AUTHORIZATION_B64: ${{ secrets.WP31_EXECUTION_AUTHORIZATION_B64 }}
    steps:
      - name: Check out only the independently reviewed immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.greenfield_authorize.outputs.reviewed_ops_commit_sha }}
      - name: Verify protected Owner execution authorization only
        id: owner_authorize
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = '${{ needs.greenfield_authorize.outputs.reviewed_ops_commit_sha }}'
          test "$GITHUB_REF" = '${{ needs.greenfield_authorize.outputs.reviewed_ops_ref }}'
          test -n "$WP31_EXECUTION_AUTHORIZATION_B64"
          authorization="$RUNNER_TEMP/wp31-execution-authorization.json"
          umask 077
          printf '%s' "$WP31_EXECUTION_AUTHORIZATION_B64" | base64 --decode >"$authorization"
          python3 scripts/wp31_greenfield_canary.py authorization-check \
            --evidence "$authorization" \
            --evidence-sha256 '${{ inputs.execution_authorization_sha256 }}' \
            --pro-review-evidence-sha256 '${{ needs.greenfield_authorize.outputs.pro_review_evidence_sha256 }}' \
            --phase '${{ inputs.phase }}' \
            --executing-ref "$GITHUB_REF" \
            --reviewed-ops-commit-sha "$GITHUB_SHA"
          echo 'execution_authorization_sha256=${{ inputs.execution_authorization_sha256 }}' >>"$GITHUB_OUTPUT"
          rm -f -- "$authorization"

  greenfield_canary:
    needs:
      - greenfield_authorize
      - greenfield_execution_authorize
    if: >-
      needs.greenfield_authorize.result == 'success' &&
      needs.greenfield_execution_authorize.result == 'success' &&
      needs.greenfield_authorize.outputs.reviewed_ops_commit_sha == github.sha &&
      needs.greenfield_authorize.outputs.reviewed_ops_ref == github.ref &&
      needs.greenfield_execution_authorize.outputs.execution_authorization_sha256 == inputs.execution_authorization_sha256 &&
      inputs.candidate == '0e86352d109fd49c7e4f4fc26d36a14822dc7219' &&
      ((inputs.phase == 'greenfield-canary-fast' && inputs.confirmation == 'FAST_CANARY_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-preflight' && inputs.confirmation == 'PREFLIGHT_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-backup-restore' && inputs.confirmation == 'BACKUP_RESTORE_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-deploy' && inputs.confirmation == 'DEPLOY_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-inspect' && inputs.confirmation == 'INSPECT_0E86352_PRODUCTION_CANARY') ||
      (inputs.phase == 'greenfield-rollback' && inputs.confirmation == 'ROLLBACK_0E86352_TO_FF53052'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-canary-uat
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      VOLCENGINE_REGION: cn-beijing
      VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_REGION: cn-beijing
      AWS_ENDPOINT_URL_S3: https://tos-s3-cn-beijing.volces.com
      AWS_S3_USE_PATH_STYLE: "false"
      TF_VAR_primary_zone_id: ${{ vars.WP08_PRIMARY_ZONE_ID }}
      TF_VAR_secondary_zone_id: ${{ vars.WP08_SECONDARY_ZONE_ID }}
      TF_VAR_dns_zone_id: ${{ secrets.WP08_DNS_ZONE_ID }}
      TF_VAR_ecs_image_id: ${{ vars.WP08_ECS_IMAGE_ID }}
      TF_VAR_ecs_instance_type: ${{ vars.WP08_ECS_INSTANCE_TYPE }}
      TF_VAR_ecs_ssh_public_key: ${{ secrets.WP08_DEPLOY_SSH_PUBLIC_KEY }}
      TF_VAR_migration_db_password: ${{ secrets.WP08_MIGRATION_DB_PASSWORD }}
      TF_VAR_runtime_db_password: ${{ secrets.WP08_RUNTIME_DB_PASSWORD }}
      TF_VAR_tos_bucket_name: ${{ secrets.WP08_TOS_BUCKET_NAME }}
      WP08_MIGRATION_DB_PASSWORD: ${{ secrets.WP08_MIGRATION_DB_PASSWORD }}
      WP08_RUNTIME_DB_PASSWORD: ${{ secrets.WP08_RUNTIME_DB_PASSWORD }}
      WP08_RDS_CA_PEM_B64: ${{ secrets.WP08_RDS_CA_PEM_B64 }}
      WP09_IDENTITY_SUBJECT_SECRET: ${{ secrets.WP09_IDENTITY_SUBJECT_SECRET }}
      WP09_FEISHU_APP_ID: ${{ secrets.WP09_FEISHU_APP_ID }}
      WP09_FEISHU_APP_SECRET: ${{ secrets.WP09_FEISHU_APP_SECRET }}
      WP15_SESSION_SECRET: ${{ secrets.WP15_SESSION_SECRET }}
      WP15_INVITE_SECRET: ${{ secrets.WP15_INVITE_SECRET }}
      WP15_IMPORT_SIGNING_KEY: ${{ secrets.WP15_IMPORT_SIGNING_KEY }}
      WP15_BACKUP_KEY: ${{ secrets.WP15_BACKUP_KEY }}
      WP31_CANARY_LEARNER_USER_IDS: ${{ secrets.WP31_CANARY_LEARNER_USER_IDS }}
      WP31_IDENTITY_BOOTSTRAP_REQUEST_B64: ${{ secrets.WP31_IDENTITY_BOOTSTRAP_REQUEST_B64 }}
      WP31_EXECUTION_AUTHORIZATION_B64: ${{ secrets.WP31_EXECUTION_AUTHORIZATION_B64 }}
    steps:
      - name: Check out only the independently reviewed immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.greenfield_authorize.outputs.reviewed_ops_commit_sha }}
      - name: Re-enforce exact Environment and protected Owner authorization before infrastructure tools
        env:
          PRO_REVIEW_EVIDENCE_B64: ${{ inputs.pro_review_evidence_b64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = '${{ needs.greenfield_authorize.outputs.reviewed_ops_commit_sha }}'
          test "$GITHUB_REF" = '${{ needs.greenfield_authorize.outputs.reviewed_ops_ref }}'
          test -n "$WP31_EXECUTION_AUTHORIZATION_B64"
          authorization="$RUNNER_TEMP/wp31-execution-authorization.json"
          umask 077
          printf '%s' "$WP31_EXECUTION_AUTHORIZATION_B64" | base64 --decode >"$authorization"
          python3 scripts/wp31_greenfield_canary.py contract-check
          python3 scripts/wp31_ops_closure.py
          if [[ '${{ inputs.phase }}' != greenfield-canary-fast ]]; then
            test -n "$PRO_REVIEW_EVIDENCE_B64"
            pro="$RUNNER_TEMP/wp31-pro-review-evidence.json"
            printf '%s' "$PRO_REVIEW_EVIDENCE_B64" | base64 --decode >"$pro"
            python3 scripts/wp31_greenfield_canary.py review-check \
              --evidence "$pro" \
              --evidence-sha256 '${{ inputs.pro_review_evidence_sha256 }}' \
              --executing-ref "$GITHUB_REF"
          fi
          python3 scripts/wp31_greenfield_canary.py authorization-check \
            --evidence "$authorization" \
            --evidence-sha256 '${{ inputs.execution_authorization_sha256 }}' \
            --pro-review-evidence-sha256 '${{ inputs.pro_review_evidence_sha256 }}' \
            --phase '${{ inputs.phase }}' \
            --executing-ref "$GITHUB_REF" \
            --reviewed-ops-commit-sha "$GITHUB_SHA"
          rm -f -- "${pro:-}" "$authorization"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Download exact registry-bound candidate evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: wp07-candidate-0e86352d109fd49c7e4f4fc26d36a14822dc7219
