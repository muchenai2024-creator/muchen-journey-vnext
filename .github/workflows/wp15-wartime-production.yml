          required={"operator_user_id","learner_user_id","owner_user_id","operator_roles","owner_roles","operator_link_id","operator_link_start_path","operator_link_expires_at","expires_in_minutes"}
          assert set(value) == required
          assert value["operator_roles"] == ["OPERATOR","REVIEWER"]
          assert value["owner_roles"] == ["LEARNER","REVIEWER"]
          assert len(open(sys.argv[1], "rb").read()) < 446
          PY
          openssl pkeyutl -encrypt -pubin -inkey "$public_key" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -in "$RUNNER_TEMP/identity-result.json" -out "$RUNNER_TEMP/identity-result.json.enc"
          install -d -m 0700 "$RUNNER_TEMP/wp31-identity-proof"
          mv "$RUNNER_TEMP/identity-result.json.enc" "$RUNNER_TEMP/wp31-identity-proof/identity-bootstrap-result.json.enc"
          printf '%s\n' '{"encrypted":true,"plaintext_retained":false,"worker_started":false,"canary_deployed":false}' >"$RUNNER_TEMP/wp31-identity-proof/identity-bootstrap-proof.json"
          rm -f -- "$bundle/request.json" "$bundle/wp31_identity_bootstrap.py"
          rm -f -- "$RUNNER_TEMP/identity-result.json" "$public_key"
      - name: Deploy exact zero-worker Canary against isolated restore
        id: deploy
        if: inputs.phase == 'greenfield-deploy' || inputs.phase == 'greenfield-canary-fast'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/wp31-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp31-known-hosts")
          release="/srv/journey-next-production/canary/releases/${{ inputs.candidate }}-$GITHUB_RUN_ID"
          echo "release=$release" >>"$GITHUB_OUTPUT"
          ssh "${opts[@]}" root@"$PUBLIC_IP" "test ! -e '$release' && install -d -m 0700 '$release'"
          tar -C "$RUNNER_TEMP/wp31-bundle" -czf - . | ssh "${opts[@]}" root@"$PUBLIC_IP" "tar -xzf - -C '$release'"
          printf '%s' "$GHCR_TOKEN" | ssh "${opts[@]}" root@"$PUBLIC_IP" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ops_sha=$(sha256sum config/wp31_greenfield_canary_ops_manifest.json | awk '{print $1}')
          backup_run_id='${{ inputs.backup_run_id }}'; preflight_run_id='${{ inputs.preflight_run_id }}'
          if [[ '${{ inputs.phase }}' == greenfield-canary-fast ]]; then backup_run_id="$GITHUB_RUN_ID"; preflight_run_id="$GITHUB_RUN_ID"; fi
          ssh "${opts[@]}" root@"$PUBLIC_IP" "cd '$release' && set -a && . ./.deployment.env && . ./secrets/backup.env && set +a && BACKUP_RUN_ID='$backup_run_id' PREFLIGHT_RUN_ID='$preflight_run_id' WP31_OPS_MANIFEST_SHA256='$ops_sha' WP31_DEPLOY_RUN_ID='$GITHUB_RUN_ID' ./deploy.sh"
      - name: Inspect exact public and remote Canary state
        id: inspect
        if: inputs.phase == 'greenfield-deploy' || inputs.phase == 'greenfield-inspect' || inputs.phase == 'greenfield-canary-fast'
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          ready=$(curl -fsS --connect-timeout 3 --max-time 10 https://journey.muchenai.com/health/ready)
          python3 - "$ready" <<'PY'
          import json, sys
          assert json.loads(sys.argv[1]) == {"status": "ready", "release": "0e86352d109fd49c7e4f4fc26d36a14822dc7219"}
          PY
          opts=(-i "$RUNNER_TEMP/wp31-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp31-known-hosts")
          ssh "${opts[@]}" root@"$PUBLIC_IP" 'set -e; release=$(readlink -f /srv/journey-next-production/canary/current); cd "$release"; test "$(docker compose -f compose.canary.yaml config --services | tr "\n" ",")" = api,web,; docker compose -f compose.canary.yaml ps --status running --services | sort | diff -u <(printf "api\nweb\n") -'
          if [[ '${{ inputs.phase }}' == greenfield-deploy || '${{ inputs.phase }}' == greenfield-canary-fast ]]; then
            proof="$RUNNER_TEMP/wp31-deploy-proof"
            install -d -m 0700 "$proof"
            python3 - "$proof/deploy-facts.json" <<'PY'
          import json,sys
          value={"public_release":"0e86352d109fd49c7e4f4fc26d36a14822dc7219","services":["api","web"],"worker_started":False,"release_go":False}
          open(sys.argv[1],"x").write(json.dumps(value,sort_keys=True)+"\n")
          PY
            WP15_BACKUP_KEY="$WP15_BACKUP_KEY" python3 scripts/wp31_phase_evidence.py create \
              --evidence "$proof/phase-evidence.json" --phase deploy --run-id "$GITHUB_RUN_ID" \
              --candidate '${{ inputs.candidate }}' \
              --ops-manifest-sha256 "$(sha256sum config/wp31_greenfield_canary_ops_manifest.json | awk '{print $1}')" \
              --rollback-candidate ff53052847a268d025bceb93c3eab37986d50219 \
              --previous-run-id '${{ inputs.backup_run_id }}' --payload-dir "$proof" \
              --payload "$proof/deploy-facts.json" --lifetime-minutes 60
          fi
      - name: Upload exact expiring deploy evidence
        id: upload_deploy_evidence
        if: (inputs.phase == 'greenfield-deploy' || inputs.phase == 'greenfield-canary-fast') && steps.inspect.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp31-canary-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/wp31-deploy-proof
          if-no-files-found: error
          retention-days: 7
      - name: Upload encrypted identity bootstrap result
        if: inputs.phase == 'greenfield-canary-fast'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp31-identity-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/wp31-identity-proof
          if-no-files-found: error
          retention-days: 1
      - name: Automatic rollback after any deploy or public inspection failure
        if: >-
          always() && (inputs.phase == 'greenfield-deploy' || inputs.phase == 'greenfield-canary-fast') &&
          (steps.deploy.outcome == 'failure' || steps.inspect.outcome == 'failure' ||
          steps.upload_deploy_evidence.outcome == 'failure')
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set +e
          opts=(-i "$RUNNER_TEMP/wp31-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp31-known-hosts")
          release='${{ steps.deploy.outputs.release }}'
          ssh "${opts[@]}" root@"$PUBLIC_IP" "
            set +e
            if test -n '$release' && test -d '$release'; then
              cd '$release'
              WP31_EDGE_MODE=rollback WP31_EDGE_SOURCE='$release/Caddyfile.rollback' ./edge.sh
              docker compose -f compose.canary.yaml down
            fi
            if test -L /srv/journey-next-production/canary/current && test \"\$(readlink -f /srv/journey-next-production/canary/current)\" = '$release'; then
              rm -f -- /srv/journey-next-production/canary/current
            fi
            install -d -m 0700 /srv/journey-next-production/canary/failures
            printf '%s\n' '{\"candidate_sha\":\"0e86352d109fd49c7e4f4fc26d36a14822dc7219\",\"automatic_rollback\":\"ATTEMPTED\",\"database_preserved\":true,\"release_evidence_preserved\":true}' >'/srv/journey-next-production/canary/failures/$GITHUB_RUN_ID.workflow.json'
            chmod 0600 '/srv/journey-next-production/canary/failures/$GITHUB_RUN_ID.workflow.json'
          "
          ready=$(curl -fsS --connect-timeout 3 --max-time 10 https://journey.muchenai.com/health/ready)
          python3 - "$ready" <<'PY'
          import json,sys
          assert json.loads(sys.argv[1]) == {"status":"ready","release":"ff53052847a268d025bceb93c3eab37986d50219"}
          PY
      - name: Roll back edge to exact current production and stop Canary
        if: inputs.phase == 'greenfield-rollback'
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/wp31-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp31-known-hosts")
          ssh "${opts[@]}" root@"$PUBLIC_IP" '/srv/journey-next-production/canary/current/rollback.sh'
          ssh "${opts[@]}" root@"$PUBLIC_IP" "python3 - --profile cutover" <scripts/wp15_production_inventory.py
          ready=$(curl -fsS --connect-timeout 3 --max-time 10 https://journey.muchenai.com/health/ready)
          python3 - "$ready" <<'PY'
          import json,sys
          assert json.loads(sys.argv[1]) == {"status":"ready","release":"ff53052847a268d025bceb93c3eab37986d50219"}
          PY
      - name: Always remove transient credentials and remote registry session
        if: always()
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set +e
          cleanup_status=0
          if [[ -s "$RUNNER_TEMP/wp31-key" && -n "$PUBLIC_IP" ]]; then
            opts=(-i "$RUNNER_TEMP/wp31-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp31-known-hosts")
            ssh "${opts[@]}" root@"$PUBLIC_IP" "docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- '/srv/journey-next-production/canary/restore-runs/$GITHUB_RUN_ID'" || cleanup_status=1
          fi
          rm -rf -- "$RUNNER_TEMP/wp31-bundle" "$RUNNER_TEMP/wp31-identity-proof" "$RUNNER_TEMP/wp31-pro-review-evidence.json"
          rm -f -- "$RUNNER_TEMP/identity-result.json" "$RUNNER_TEMP/wp31-recipient-public.pem" "$RUNNER_TEMP/wp31-key" "$RUNNER_TEMP/wp31-known-hosts"
          echo 'WP31_TRANSIENT_CREDENTIALS=REMOVED'
          exit "$cleanup_status"
      - name: Close temporary SSH ingress
        if: always() && steps.frozen.outputs.security_group_id != ''
        run: |
          set -euo pipefail
          if [[ -n "${WP31_RUNNER_CIDR:-}" ]]; then python3 -m scripts.wp08_security_group close --security-group-id '${{ steps.frozen.outputs.security_group_id }}' --cidr "$WP31_RUNNER_CIDR"; fi
          echo 'WP31_TEMPORARY_SSH_INGRESS=CLOSED'

  legacy_identity_bootstrap_disabled:
    needs:
      - greenfield_authorize
      - greenfield_execution_authorize
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-canary-uat
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      VOLCENGINE_REGION: cn-beijing
      VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_REGION: cn-beijing
      AWS_ENDPOINT_URL_S3: https://tos-s3-cn-beijing.volces.com
      AWS_S3_USE_PATH_STYLE: "false"
      TF_VAR_primary_zone_id: ${{ vars.WP08_PRIMARY_ZONE_ID }}
      TF_VAR_secondary_zone_id: ${{ vars.WP08_SECONDARY_ZONE_ID }}
      TF_VAR_dns_zone_id: ${{ secrets.WP08_DNS_ZONE_ID }}
      TF_VAR_ecs_image_id: ${{ vars.WP08_ECS_IMAGE_ID }}
      TF_VAR_ecs_instance_type: ${{ vars.WP08_ECS_INSTANCE_TYPE }}
      TF_VAR_ecs_ssh_public_key: ${{ secrets.WP08_DEPLOY_SSH_PUBLIC_KEY }}
      WP08_MIGRATION_DB_PASSWORD: ${{ secrets.WP08_MIGRATION_DB_PASSWORD }}
      WP08_RUNTIME_DB_PASSWORD: ${{ secrets.WP08_RUNTIME_DB_PASSWORD }}
      WP08_RDS_CA_PEM_B64: ${{ secrets.WP08_RDS_CA_PEM_B64 }}
      WP09_IDENTITY_SUBJECT_SECRET: ${{ secrets.WP09_IDENTITY_SUBJECT_SECRET }}
      WP09_FEISHU_APP_ID: ${{ secrets.WP09_FEISHU_APP_ID }}
      WP09_FEISHU_APP_SECRET: ${{ secrets.WP09_FEISHU_APP_SECRET }}
      WP15_SESSION_SECRET: ${{ secrets.WP15_SESSION_SECRET }}
      WP15_INVITE_SECRET: ${{ secrets.WP15_INVITE_SECRET }}
      WP15_IMPORT_SIGNING_KEY: ${{ secrets.WP15_IMPORT_SIGNING_KEY }}
      WP31_IDENTITY_BOOTSTRAP_REQUEST_B64: ${{ secrets.WP31_IDENTITY_BOOTSTRAP_REQUEST_B64 }}
      WP31_EXECUTION_AUTHORIZATION_B64: ${{ secrets.WP31_EXECUTION_AUTHORIZATION_B64 }}
    steps:
      - name: Check out only the independently reviewed immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.greenfield_authorize.outputs.reviewed_ops_commit_sha }}
      - name: Verify exact authorization and public recipient key
        env:
          PRO_REVIEW_EVIDENCE_B64: ${{ inputs.pro_review_evidence_b64 }}
          RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = '${{ needs.greenfield_authorize.outputs.reviewed_ops_commit_sha }}'
          test "$GITHUB_REF" = '${{ needs.greenfield_authorize.outputs.reviewed_ops_ref }}'
          test -n "$PRO_REVIEW_EVIDENCE_B64"
          test -n "$WP31_EXECUTION_AUTHORIZATION_B64"
          test -n "$RECIPIENT_PUBLIC_KEY_B64"
          pro="$RUNNER_TEMP/wp31-pro-review-evidence.json"
          authorization="$RUNNER_TEMP/wp31-execution-authorization.json"
          public_key="$RUNNER_TEMP/wp31-recipient-public.pem"
          umask 077
          printf '%s' "$PRO_REVIEW_EVIDENCE_B64" | base64 --decode >"$pro"
          printf '%s' "$WP31_EXECUTION_AUTHORIZATION_B64" | base64 --decode >"$authorization"
          printf '%s' "$RECIPIENT_PUBLIC_KEY_B64" | base64 --decode >"$public_key"
          openssl pkey -pubin -in "$public_key" -text_noout >/dev/null
          openssl pkey -pubin -in "$public_key" -text -noout | grep -Fqx 'Public-Key: (4096 bit)'
          python3 scripts/wp31_greenfield_canary.py contract-check
          python3 scripts/wp31_ops_closure.py
          python3 scripts/wp31_greenfield_canary.py review-check --evidence "$pro" --evidence-sha256 '${{ inputs.pro_review_evidence_sha256 }}' --executing-ref "$GITHUB_REF"
          python3 scripts/wp31_greenfield_canary.py authorization-check --evidence "$authorization" --evidence-sha256 '${{ inputs.execution_authorization_sha256 }}' --pro-review-evidence-sha256 '${{ inputs.pro_review_evidence_sha256 }}' --phase '${{ inputs.phase }}' --executing-ref "$GITHUB_REF" --reviewed-ops-commit-sha "$GITHUB_SHA"
          rm -f -- "$pro" "$authorization"
      - name: Initialize frozen infrastructure state read-only
        working-directory: infra/staging
        run: |
          terraform init -backend-config="bucket=${{ secrets.WP08_TF_STATE_BUCKET }}" -backend-config="key=terraform/wp08-staging.tfstate" -backend-config="region=cn-beijing" -backend-config="skip_credentials_validation=true" -backend-config="skip_region_validation=true" -backend-config="skip_requesting_account_id=true" -backend-config="skip_s3_checksum=true"
          terraform validate
      - name: Read frozen host and RDS coordinates
        id: frozen_identity
        working-directory: infra/staging
        run: |
          set -euo pipefail
          public_ip=$(terraform output -raw staging_public_ip)
          security_group_id=$(terraform output -raw staging_security_group_id)
          rds_host=$(terraform output -raw rds_private_host)
          rds_port=$(terraform output -raw rds_private_port)
          for value in "$public_ip" "$security_group_id" "$rds_host" "$rds_port"; do test -n "$value"; echo "::add-mask::$value"; done
          echo "public_ip=$public_ip" >>"$GITHUB_OUTPUT"
          echo "security_group_id=$security_group_id" >>"$GITHUB_OUTPUT"
          echo "rds_host=$rds_host" >>"$GITHUB_OUTPUT"
          echo "rds_port=$rds_port" >>"$GITHUB_OUTPUT"
      - name: Open bounded SSH ingress
        id: open_identity_ssh
        run: |
          set -euo pipefail
          runner_ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$runner_ip"
          echo "WP31_RUNNER_CIDR=$runner_ip/32" >>"$GITHUB_ENV"
          python3 -m scripts.wp08_security_group open --security-group-id '${{ steps.frozen_identity.outputs.security_group_id }}' --cidr "$runner_ip/32"
          printf '%s\n' '${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}' >"$RUNNER_TEMP/wp31-key"
          chmod 0600 "$RUNNER_TEMP/wp31-key"
      - name: Recheck exact rollback release and no conflicting Canary
        env:
          PUBLIC_IP: ${{ steps.frozen_identity.outputs.public_ip }}
        run: |
          set -euo pipefail
          ready=$(curl -fsS --connect-timeout 3 --max-time 10 https://journey.muchenai.com/health/ready)
          test "$ready" = '{"status":"ready","release":"ff53052847a268d025bceb93c3eab37986d50219"}'
          opts=(-i "$RUNNER_TEMP/wp31-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp31-known-hosts")
          ssh "${opts[@]}" root@"$PUBLIC_IP" "python3 - --profile cutover" <scripts/wp15_production_inventory.py
          ssh "${opts[@]}" root@"$PUBLIC_IP" "test ! -L /srv/journey-next-production/canary/current"
      - name: Prepare sealed source-database bootstrap bundle
        env:
          REQUEST_B64: ${{ secrets.WP31_IDENTITY_BOOTSTRAP_REQUEST_B64 }}
        run: |
          set -euo pipefail
          test -n "$REQUEST_B64"
          bundle="$RUNNER_TEMP/wp31-identity-bootstrap"
          python3 scripts/wp31_prepare_greenfield_canary.py --output "$bundle" --rds-host '${{ steps.frozen_identity.outputs.rds_host }}' --rds-port '${{ steps.frozen_identity.outputs.rds_port }}'
          printf '%s' "$REQUEST_B64" | base64 --decode >"$bundle/request.json"
          chmod 0600 "$bundle/request.json"
          cp scripts/wp31_identity_bootstrap.py "$bundle/wp31_identity_bootstrap.py"
          chmod 0555 "$bundle/wp31_identity_bootstrap.py"
      - name: Run identity bootstrap and encrypt response for the requester
        id: identity_result
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
          PUBLIC_IP: ${{ steps.frozen_identity.outputs.public_ip }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/wp31-identity-bootstrap"
          public_key="$RUNNER_TEMP/wp31-recipient-public.pem"
          printf '%s' "$RECIPIENT_PUBLIC_KEY_B64" | base64 --decode >"$public_key"
          opts=(-i "$RUNNER_TEMP/wp31-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp31-known-hosts")
          remote="/srv/journey-next-production/canary/identity-bootstrap-runs/$GITHUB_RUN_ID"
          ssh "${opts[@]}" root@"$PUBLIC_IP" "test ! -e '$remote' && install -d -m 0700 '$remote'"
          tar -C "$bundle" -czf - . | ssh "${opts[@]}" root@"$PUBLIC_IP" "tar -xzf - -C '$remote'"
          printf '%s' "$GHCR_TOKEN" | ssh "${opts[@]}" root@"$PUBLIC_IP" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          image='ghcr.io/muchenai/muchen-journey-vnext-api@sha256:01e74f77faf364e65d157403262676f19d98f4862cd5ee0a80396fac91a7bce8'
          ssh "${opts[@]}" root@"$PUBLIC_IP" "docker pull '$image' >/dev/null && docker run --rm --network host --env-file '$remote/secrets/source-facts.env' -v '$remote/wp31_identity_bootstrap.py:/tmp/wp31_identity_bootstrap.py:ro' -v '$remote/request.json:/tmp/request.json:ro' -v '$remote/secrets/volcengine-rds-ca.pem:/run/secrets/volcengine-rds-ca.pem:ro' '$image' python /tmp/wp31_identity_bootstrap.py --request /tmp/request.json --confirm BOOTSTRAP_IDENTITIES_0E86352_PRODUCTION_CANARY >'$remote/result.json'"
          scp "${opts[@]}" root@"$PUBLIC_IP":"$remote/result.json" "$RUNNER_TEMP/wp31-identity-result.json"
          python3 - "$RUNNER_TEMP/wp31-identity-result.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1], encoding="utf-8"))
          required={"operator_user_id","learner_user_id","owner_user_id","operator_roles","owner_roles","operator_link_id","operator_link_start_path","operator_link_expires_at","expires_in_minutes"}
          assert set(value) == required
          assert value["operator_roles"] == ["OPERATOR","REVIEWER"]
          assert value["owner_roles"] == ["LEARNER","REVIEWER"]
          assert value["operator_link_start_path"].startswith("/auth/feishu?return_to=%2Fops&link_token=")
          assert len(open(sys.argv[1], "rb").read()) < 446
          PY
          openssl pkeyutl -encrypt -pubin -inkey "$public_key" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -in "$RUNNER_TEMP/wp31-identity-result.json" -out "$RUNNER_TEMP/wp31-identity-result.json.enc"
          install -d -m 0700 "$RUNNER_TEMP/wp31-identity-proof"
          mv "$RUNNER_TEMP/wp31-identity-result.json.enc" "$RUNNER_TEMP/wp31-identity-proof/identity-bootstrap-result.json.enc"
          printf '%s\n' '{"encrypted":true,"plaintext_retained":false,"worker_started":false,"canary_deployed":false}' >"$RUNNER_TEMP/wp31-identity-proof/identity-bootstrap-proof.json"
          rm -f -- "$RUNNER_TEMP/wp31-identity-result.json" "$public_key"
      - name: Upload encrypted identity bootstrap result only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp31-identity-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/wp31-identity-proof
          if-no-files-found: error
          retention-days: 1
      - name: Always remove identity bootstrap credentials and remote result
        if: always()
        env:
          PUBLIC_IP: ${{ steps.frozen_identity.outputs.public_ip }}
        run: |
          set +e
          opts=(-i "$RUNNER_TEMP/wp31-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp31-known-hosts")
          if [[ -s "$RUNNER_TEMP/wp31-key" && -n "$PUBLIC_IP" ]]; then
            ssh "${opts[@]}" root@"$PUBLIC_IP" "docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- '/srv/journey-next-production/canary/identity-bootstrap-runs/$GITHUB_RUN_ID'"
          fi
          rm -rf -- "$RUNNER_TEMP/wp31-identity-bootstrap" "$RUNNER_TEMP/wp31-identity-proof"
          rm -f -- "$RUNNER_TEMP/wp31-key" "$RUNNER_TEMP/wp31-known-hosts" "$RUNNER_TEMP/wp31-recipient-public.pem"
          echo 'WP31_IDENTITY_BOOTSTRAP_TRANSIENT_CREDENTIALS=REMOVED'
      - name: Close temporary SSH ingress
        if: always() && steps.frozen_identity.outputs.security_group_id != ''
        run: |
          set -euo pipefail
          if [[ -n "${WP31_RUNNER_CIDR:-}" ]]; then python3 -m scripts.wp08_security_group close --security-group-id '${{ steps.frozen_identity.outputs.security_group_id }}' --cidr "$WP31_RUNNER_CIDR"; fi
          echo 'WP31_TEMPORARY_SSH_INGRESS=CLOSED'

  operate:
    if: >-
      inputs.candidate == 'ff53052847a268d025bceb93c3eab37986d50219' &&
      ((inputs.phase == 'preflight' && inputs.confirmation == 'PREFLIGHT_FF53052_WARTIME_PRODUCTION') ||
      (inputs.phase == 'backup-restore' && inputs.confirmation == 'BACKUP_RESTORE_FF53052_WARTIME_PRODUCTION') ||
      (inputs.phase == 'archive-backup' && inputs.confirmation == 'ARCHIVE_BACKUP_31346697068_WARTIME_PRODUCTION') ||
      (inputs.phase == 'deploy' && inputs.confirmation == 'DEPLOY_FF53052_WARTIME_PRODUCTION') ||
      (inputs.phase == 'inspect' && inputs.confirmation == 'INSPECT_FF53052_WARTIME_PRODUCTION') ||
      (inputs.phase == 'rollback' && inputs.confirmation == 'ROLLBACK_FF53052_TO_CONTROLLED_ALPHA_BASELINE') ||
      (inputs.phase == 'maintenance' && inputs.confirmation == 'MAINTENANCE_JOURNEY_PRODUCTION') ||
      (inputs.phase == 'live' && inputs.confirmation == 'LIVE_JOURNEY_PRODUCTION'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      VOLCENGINE_REGION: cn-beijing
      VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_REGION: cn-beijing
      AWS_ENDPOINT_URL_S3: https://tos-s3-cn-beijing.volces.com
      AWS_S3_USE_PATH_STYLE: "false"
      TF_VAR_primary_zone_id: ${{ vars.WP08_PRIMARY_ZONE_ID }}
      TF_VAR_secondary_zone_id: ${{ vars.WP08_SECONDARY_ZONE_ID }}
      TF_VAR_dns_zone_id: ${{ secrets.WP08_DNS_ZONE_ID }}
      TF_VAR_ecs_image_id: ${{ vars.WP08_ECS_IMAGE_ID }}
      TF_VAR_ecs_instance_type: ${{ vars.WP08_ECS_INSTANCE_TYPE }}
      TF_VAR_ecs_ssh_public_key: ${{ secrets.WP08_DEPLOY_SSH_PUBLIC_KEY }}
      TF_VAR_migration_db_password: ${{ secrets.WP08_MIGRATION_DB_PASSWORD }}
      TF_VAR_runtime_db_password: ${{ secrets.WP08_RUNTIME_DB_PASSWORD }}
      TF_VAR_tos_bucket_name: ${{ secrets.WP08_TOS_BUCKET_NAME }}
      WP08_MIGRATION_DB_PASSWORD: ${{ secrets.WP08_MIGRATION_DB_PASSWORD }}
      WP08_RUNTIME_DB_PASSWORD: ${{ secrets.WP08_RUNTIME_DB_PASSWORD }}
      WP09_IDENTITY_SUBJECT_SECRET: ${{ secrets.WP09_IDENTITY_SUBJECT_SECRET }}
      WP09_FEISHU_APP_ID: ${{ secrets.WP09_FEISHU_APP_ID }}
      WP09_FEISHU_APP_SECRET: ${{ secrets.WP09_FEISHU_APP_SECRET }}
      WP11_NOTIFICATION_RECIPIENT_KEY: ${{ secrets.WP11_NOTIFICATION_RECIPIENT_KEY }}
      WP11_FEISHU_APP_ID: ${{ secrets.WP11_FEISHU_APP_ID }}
      WP11_FEISHU_APP_SECRET: ${{ secrets.WP11_FEISHU_APP_SECRET }}
      WP08_RDS_CA_PEM_B64: ${{ secrets.WP08_RDS_CA_PEM_B64 }}
      WP15_SESSION_SECRET: ${{ secrets.WP15_SESSION_SECRET }}
      WP15_INVITE_SECRET: ${{ secrets.WP15_INVITE_SECRET }}
      WP15_IMPORT_SIGNING_KEY: ${{ secrets.WP15_IMPORT_SIGNING_KEY }}
      WP15_BACKUP_KEY: ${{ secrets.WP15_BACKUP_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Download exact frozen candidate evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: wp07-candidate-ff53052847a268d025bceb93c3eab37986d50219
          path: artifacts/wp07-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31340959377
      - name: Verify immutable wartime contract
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "${{ inputs.candidate }}" = "$(jq -r .candidate_sha config/wp15_wartime_cutover.json)"
          manifest=artifacts/wp07-candidate/release-manifest.json
          test "$(jq -r .candidate.commit_sha "$manifest")" = "${{ inputs.candidate }}"
          test "$(jq -r .migration.head "$manifest")" = 0019_wp30_invitation_control
          test "$(jq -r .config_schema_version "$manifest")" = 3
          for service in api web worker; do
            expected=$(jq -r ".images.$service" config/wp15_wartime_cutover.json)
            digest=$(jq -r ".images.$service.registry_digest" "$manifest")
            test "$expected" = "ghcr.io/muchenai2024-creator/muchen-journey-vnext-$service@$digest"
          done
          if [[ "${{ inputs.phase }}" == deploy ]]; then
            [[ "${{ inputs.backup_run_id }}" =~ ^[1-9][0-9]{5,19}$ ]]
            [[ "${{ inputs.archive_run_id }}" =~ ^[1-9][0-9]{5,19}$ ]]
          elif [[ "${{ inputs.phase }}" == archive-backup ]]; then
            test "${{ inputs.backup_run_id }}" = 31346697068
            test -z "${{ inputs.archive_run_id }}"
          else
            test -z "${{ inputs.backup_run_id }}"
            test -z "${{ inputs.archive_run_id }}"
          fi
          make wp15-wartime-cutover-check
      - name: Download exact off-host backup proof
        if: inputs.phase == 'deploy'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: wp15-wartime-backup-${{ inputs.archive_run_id }}
          path: artifacts/wp15-wartime-backup
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.archive_run_id }}
      - name: Verify downloaded off-host backup proof
        if: inputs.phase == 'deploy'
        run: |
          WP15_BACKUP_KEY="$WP15_BACKUP_KEY" python3 scripts/wp15_archive_wartime_proof.py \
            --directory artifacts/wp15-wartime-backup \
            --run-id '${{ inputs.backup_run_id }}'
      - name: Initialize frozen shared state read-only
        working-directory: infra/staging
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.WP08_TF_STATE_BUCKET }}" \
            -backend-config="key=terraform/wp08-staging.tfstate" \
            -backend-config="region=cn-beijing" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true"
          terraform validate
      - name: Read frozen infrastructure without changing it
        id: frozen
        working-directory: infra/staging
        run: |
          set -euo pipefail
          public_ip=$(terraform output -raw staging_public_ip)
          security_group_id=$(terraform output -raw staging_security_group_id)
          rds_host=$(terraform output -raw rds_private_host)
          rds_port=$(terraform output -raw rds_private_port)
          rds_instance_id=$(terraform show -json | jq -er '
            [.values.root_module.resources[]
              | select(.address == "volcenginecc_rdspostgresql_instance.staging")
              | .values.instance_id]
            | if length == 1 then .[0] else error("expected one frozen RDS instance") end
          ')
          for value in "$public_ip" "$security_group_id" "$rds_host" "$rds_port" "$rds_instance_id"; do
            test -n "$value"
            echo "::add-mask::$value"
          done
          echo "public_ip=$public_ip" >>"$GITHUB_OUTPUT"
          echo "security_group_id=$security_group_id" >>"$GITHUB_OUTPUT"
          echo "rds_host=$rds_host" >>"$GITHUB_OUTPUT"
          echo "rds_port=$rds_port" >>"$GITHUB_OUTPUT"
          echo "rds_instance_id=$rds_instance_id" >>"$GITHUB_OUTPUT"
      - name: Create only the exact empty cutover database
        if: inputs.phase == 'backup-restore'
        run: |
          set -euo pipefail
          python3 -m scripts.wp15_rds_database \
            --instance-id '${{ steps.frozen.outputs.rds_instance_id }}' \
            --database journey_next_cutover_20260810
          python3 -m scripts.wp15_rds_schema_owner \
            --instance-id '${{ steps.frozen.outputs.rds_instance_id }}' \
            --database journey_next_cutover_20260810
      - name: Open bounded SSH ingress
        run: |
          set -euo pipefail
          runner_ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')
          python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          echo "WP15_WARTIME_RUNNER_CIDR=$runner_ip/32" >>"$GITHUB_ENV"
          python3 -m scripts.wp08_security_group open \
            --security-group-id "${{ steps.frozen.outputs.security_group_id }}" \
            --cidr "$runner_ip/32"
          printf '%s\n' '${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}' \
            >"$RUNNER_TEMP/wp15-wartime-key"
          chmod 0600 "$RUNNER_TEMP/wp15-wartime-key"
      - name: Prepare exact owner-only bundle
        if: inputs.phase == 'backup-restore' || inputs.phase == 'deploy'
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/wp15-wartime-bundle"
          python3 scripts/wp15_prepare_wartime.py \
            --output "$bundle" \
            --rds-host "${{ steps.frozen.outputs.rds_host }}" \
            --rds-port "${{ steps.frozen.outputs.rds_port }}"
          cp deploy/production/compose.yaml deploy/production/compose.migrate.yaml "$bundle/"
          cp deploy/production/wartime_grant_runtime.py "$bundle/grant_runtime.py"
          cp deploy/production/wartime_backup_restore.sh "$bundle/"
          cp deploy/production/wartime_deploy.sh "$bundle/"
          cp deploy/production/wartime_rollback.sh "$bundle/"
          cp deploy/production/db_facts.py "$bundle/"
          chmod 0755 "$bundle"/*.sh
      - name: Verify exact rollback baseline and frozen staging source
        if: inputs.phase == 'preflight'
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
          ssh "${opts[@]}" root@"$PUBLIC_IP" "python3 - --profile baseline" \
            <scripts/wp15_production_inventory.py
          ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "python3 - --candidate '${{ inputs.candidate }}'" \
            <scripts/wp08_runtime_inventory.py
      - name: Execute one isolated backup and restore proof
        if: inputs.phase == 'backup-restore'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
          remote="/srv/journey-next-production/restore-runs/$GITHUB_RUN_ID"
          ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "test ! -e '$remote' && install -d -m 0700 '$remote'"
          tar -C "$RUNNER_TEMP/wp15-wartime-bundle" -czf - . | \
            ssh "${opts[@]}" root@"$PUBLIC_IP" "tar -xzf - -C '$remote'"
          printf '%s' "$GHCR_TOKEN" | ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "cd '$remote' && set -a && . ./secrets/backup.env && set +a && \
            WP15_RUN_ID='$GITHUB_RUN_ID' ./wartime_backup_restore.sh"
      - name: Collect and validate exact encrypted restore proof
        if: inputs.phase == 'backup-restore' || inputs.phase == 'archive-backup'
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          source_run="$GITHUB_RUN_ID"
          if [[ "${{ inputs.phase }}" == archive-backup ]]; then
            source_run='${{ inputs.backup_run_id }}'
          fi
          source="/srv/journey-next-production/backups/$source_run"
          opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
          ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "set -e; test -d '$source' && test ! -L '$source'; \
            for name in journey-next.dump.enc backup-manifest.json source-facts.json target-facts.json; do \
              test -f '$source/'\"\$name\" && test ! -L '$source/'\"\$name\"; \
            done; \
            test ! -e '$source/journey-next.dump'; \
            test ! -e '$source/journey-next.verify.dump'"
          destination="$RUNNER_TEMP/wp15-wartime-evidence"
          install -d -m 0700 "$destination"
          for name in journey-next.dump.enc backup-manifest.json source-facts.json target-facts.json; do
            scp "${opts[@]}" root@"$PUBLIC_IP":"$source/$name" "$destination/$name"
          done
          WP15_BACKUP_KEY="$WP15_BACKUP_KEY" python3 scripts/wp15_archive_wartime_proof.py \
            --directory "$destination" --run-id "$source_run"
      - name: Upload exact encrypted off-host backup proof
        if: inputs.phase == 'backup-restore' || inputs.phase == 'archive-backup'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp15-wartime-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wp15-wartime-evidence/journey-next.dump.enc
            ${{ runner.temp }}/wp15-wartime-evidence/backup-manifest.json
            ${{ runner.temp }}/wp15-wartime-evidence/source-facts.json
            ${{ runner.temp }}/wp15-wartime-evidence/target-facts.json
          if-no-files-found: error
          retention-days: 30
      - name: Deploy exact candidate against verified isolated restore
        id: deploy_runtime
        if: inputs.phase == 'deploy'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
          release="/srv/journey-next-production/releases/${{ inputs.candidate }}-$GITHUB_RUN_ID"
          echo "release=$release" >>"$GITHUB_OUTPUT"
          ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "test ! -e '$release' && install -d -m 0700 '$release'"
          tar -C "$RUNNER_TEMP/wp15-wartime-bundle" -czf - . | \
            ssh "${opts[@]}" root@"$PUBLIC_IP" "tar -xzf - -C '$release'"
          printf '%s' "$GHCR_TOKEN" | ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          echo "started=true" >>"$GITHUB_OUTPUT"
          ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "cd '$release' && set -a && . ./.deployment.env && . ./secrets/backup.env && set +a && \
            BACKUP_RUN_ID='${{ inputs.backup_run_id }}' ./wartime_deploy.sh"
      - name: Route production to maintenance or live runtime
        if: inputs.phase == 'maintenance' || inputs.phase == 'live'
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          mode="${{ inputs.phase }}"
          opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
          remote="/run/wp15-wartime-edge-$GITHUB_RUN_ID"
          ssh "${opts[@]}" root@"$PUBLIC_IP" "install -d -m 0700 '$remote'"
          scp "${opts[@]}" deploy/production/wartime_edge_route.sh \
            root@"$PUBLIC_IP":"$remote/wartime_edge_route.sh"
          if [[ "$mode" == maintenance ]]; then
            scp "${opts[@]}" deploy/production/Caddyfile.maintenance \
              root@"$PUBLIC_IP":"$remote/Caddyfile.maintenance"
            source="$remote/Caddyfile.maintenance"
          else
            scp "${opts[@]}" deploy/staging/Caddyfile \
              root@"$PUBLIC_IP":"$remote/Caddyfile.live"
            source="$remote/Caddyfile.live"
          fi
          ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "chmod 0600 '$remote/wartime_edge_route.sh' && \
            WP15_EDGE_MODE='$mode' WP15_EDGE_SOURCE='$source' \
            bash '$remote/wartime_edge_route.sh'"
      - name: Verify observable public production surface with bounded retry
        if: inputs.phase == 'preflight' || inputs.phase == 'deploy' || inputs.phase == 'inspect' || inputs.phase == 'live'
        run: |
          set -euo pipefail
          profile=cutover
          if [[ "${{ inputs.phase }}" == preflight ]]; then profile=baseline; fi
          attempts=12
          for attempt in $(seq 1 "$attempts"); do
            if python3 scripts/wp15_public_surface.py --profile "$profile" --attempt "$attempt"; then
              echo "WP15_SURFACE_ATTEMPT=$attempt result=PASS profile=$profile"
              exit 0
            fi
            if [[ "$attempt" == "$attempts" ]]; then
              echo "WP15_SURFACE_ATTEMPT=$attempt result=FAIL retries_exhausted=true profile=$profile" >&2
              exit 1
            fi
            echo "WP15_SURFACE_ATTEMPT=$attempt result=RETRY next_in_seconds=5 profile=$profile"
            sleep 5
          done
      - name: Verify exact cutover runtime inventory
        if: success() && (inputs.phase == 'deploy' || inputs.phase == 'inspect' || inputs.phase == 'live')
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
          ssh "${opts[@]}" root@"$PUBLIC_IP" "python3 - --profile cutover" \
            <scripts/wp15_production_inventory.py
      - name: Execute one-click rollback
        if: inputs.phase == 'rollback'
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
          remote="/run/wp15-wartime-rollback-$GITHUB_RUN_ID"
          ssh "${opts[@]}" root@"$PUBLIC_IP" "install -d -m 0700 '$remote'"
          scp "${opts[@]}" deploy/production/wartime_rollback.sh \
            root@"$PUBLIC_IP":"$remote/wartime_rollback.sh"
          ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "chmod 0755 '$remote/wartime_rollback.sh' && '$remote/wartime_rollback.sh'"
      - name: Verify rollback public surface with bounded retry
        if: inputs.phase == 'rollback'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if python3 scripts/wp15_public_surface.py --profile baseline --attempt "$attempt"; then
              echo "WP15_ROLLBACK_SURFACE_ATTEMPT=$attempt result=PASS"
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "WP15_ROLLBACK_SURFACE_ATTEMPT=$attempt result=FAIL retries_exhausted=true" >&2
              exit 1
            fi
            echo "WP15_ROLLBACK_SURFACE_ATTEMPT=$attempt result=RETRY next_in_seconds=5"
            sleep 5
          done
      - name: Roll back automatically after failed deployment acceptance
        id: automatic_rollback
        if: failure() && inputs.phase == 'deploy' && steps.deploy_runtime.outputs.started == 'true'
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
          release='${{ steps.deploy_runtime.outputs.release }}'
          if ssh "${opts[@]}" root@"$PUBLIC_IP" "'$release/wartime_rollback.sh'"; then
            echo "result=pass" >>"$GITHUB_OUTPUT"
            ssh "${opts[@]}" root@"$PUBLIC_IP" \
              "test \"\$(readlink -f /srv/journey-next-production/current)\" != '$release' && rm -rf -- '$release'"
            echo "WP15_AUTOMATIC_ROLLBACK=PASS failed_release_removed=true"
          else
            echo "result=failed" >>"$GITHUB_OUTPUT"
            echo "WP15_AUTOMATIC_ROLLBACK=FAILED maintenance_required=true" >&2
          fi
      - name: Route to maintenance when automatic rollback also fails
        if: steps.automatic_rollback.outputs.result == 'failed'
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
          remote="/run/wp15-wartime-edge-$GITHUB_RUN_ID"
          ssh "${opts[@]}" root@"$PUBLIC_IP" "install -d -m 0700 '$remote'"
          scp "${opts[@]}" deploy/production/wartime_edge_route.sh \
            root@"$PUBLIC_IP":"$remote/wartime_edge_route.sh"
          scp "${opts[@]}" deploy/production/Caddyfile.maintenance \
            root@"$PUBLIC_IP":"$remote/Caddyfile.maintenance"
          ssh "${opts[@]}" root@"$PUBLIC_IP" \
            "chmod 0600 '$remote/wartime_edge_route.sh' && \
            WP15_EDGE_MODE=maintenance \
            WP15_EDGE_SOURCE='$remote/Caddyfile.maintenance' \
            bash '$remote/wartime_edge_route.sh'"
      - name: Remove owner-only temporary bundles and registry session
        if: always()
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          if [[ -f "$RUNNER_TEMP/wp15-wartime-key" && -n "${PUBLIC_IP:-}" ]]; then
            opts=(-i "$RUNNER_TEMP/wp15-wartime-key" -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$RUNNER_TEMP/wp15-wartime-known-hosts")
            ssh "${opts[@]}" root@"$PUBLIC_IP" \
              "release='/srv/journey-next-production/releases/${{ inputs.candidate }}-$GITHUB_RUN_ID'; \
              current=\$(readlink -f /srv/journey-next-production/current 2>/dev/null || true); \
              if test -d \"\$release\" && test \"\$current\" != \"\$release\"; then \
                rm -rf -- \"\$release\"; \
              fi; \
              rm -rf -- '/srv/journey-next-production/restore-runs/$GITHUB_RUN_ID' \
                '/run/wp15-wartime-rollback-$GITHUB_RUN_ID' \
                '/run/wp15-wartime-edge-$GITHUB_RUN_ID'; \
              docker logout ghcr.io >/dev/null 2>&1 || true" || true
          fi
      - name: Remove local encrypted backup proof
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/wp15-wartime-evidence"
          echo "WP15_WARTIME_LOCAL_BACKUP_PROOF=CLEANED"
      - name: Close temporary SSH ingress
        if: always() && steps.frozen.outputs.security_group_id != ''
        run: |
          if [[ -n "${WP15_WARTIME_RUNNER_CIDR:-}" ]]; then
            python3 -m scripts.wp08_security_group close \
